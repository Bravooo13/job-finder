degree: ""          # "M.S." -> also matches "Master's Degree", "Master of Science"
major: ""
gpa: ""
schoolStart: ""     # YYYY-MM
graduation: ""      # YYYY-MM
previousSchool: ""
previousDegree: ""
previousMajor: ""
previousStart: ""
previousGraduation: ""

# Work (latest job)
currentEmployer: ""
currentTitle: ""

# Work authorization (answered exactly; see skills/application-answers)
authorizedToWork: ""        # legally authorized to work in the US
needsSponsorshipNow: ""     # sponsorship needed to START this job (F-1 on CPT/OPT: no)
needsSponsorshipLater: ""   # sponsorship needed in the future, e.g. H-1B (F-1: yes)
visaStatus: ""              # e.g. "F-1 student (CPT/OPT)"
citizenship: ""
usCitizen: ""
permanentResident: ""
hasClearance: ""
