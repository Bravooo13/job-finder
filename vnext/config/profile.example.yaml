# Your standard application answers ("My info"). Copied to private/profile.yaml by `python -m jobfinder init`
# (or filled by `import-v1`). private/ is gitignored: never commit the filled-in copy.
# yes/no fields take "yes", "no" or "" (empty = not set: the form waits for you). Dates: YYYY-MM or YYYY-MM-DD.

# Contact
firstName: ""
middleName: ""
lastName: ""
preferredName: ""
pronouns: ""
email: ""
phone: ""
street: ""
street2: ""
city: ""
state: ""          # full name, e.g. Illinois
zip: ""
