over18: "yes"

# Where and how
preferredLocations: ""      # "Chicago, IL; New York, NY; Remote" in order
workArrangement: ""         # any | onsite | hybrid | remote
willingToRelocate: ""
willingToTravel: ""

# Availability and pay
startDate: ""
availability: ""            # "Summer 2027 (June to August)"
salaryExpectation: ""
hearAbout: "LinkedIn"

# Voluntary self-identification (empty = "I don't wish to answer")
gender: ""
hispanicLatino: ""
race: ""
veteran: ""
disability: ""

languages: ""               # "English; Chinese (Mandarin)"
workedHereBefore: ""

